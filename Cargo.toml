[package]
name = "sundial"
version = "1.5.0"
edition = "2024"

[dependencies]
zbus = { version = "4", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
directories = "5.0"
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
notify-rust = "4.11"
sunrise = "3.0.0"
